[package]
name = "squirreldisk"
version = "2.6.2"
edition = "2021"
description = "Fast, fun, cross-platform disk usage analyzer with an animated sunburst"
license = "AGPL-3.0-only"
repository = "https://github.com/Randy420Marsh/squirreldisk"
# Modified fork of https://github.com/adileo/squirreldisk (see NOTICE.md)

[features]
default = ["gui"]
# Everything needed for the desktop app. Build with --no-default-features
# to get the tiny headless agent used on remote servers.
gui = ["dep:eframe", "dep:egui_glow", "dep:notify", "dep:sysinfo", "dep:rodio", "dep:rfd", "dep:tiny-skia", "dep:skrifa", "dep:x11-dl", "dep:raw-window-handle"]

[dependencies]
eframe = { optional = true, version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui_glow = { version = "0.36", optional = true }
notify = { optional = true, version = "8", default-features = false, features = ["macos_fsevent"] }
trash = "5"
sysinfo = { optional = true, version = "0.39", default-features = false, features = ["disk"] }
rodio = { optional = true, version = "0.22", default-features = false, features = ["playback"] }
rfd = { optional = true, version = "0.17", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the font reader egui itself uses: same version, so nothing extra is built
skrifa = { version = "0.44", optional = true, default-features = false, features = ["std"] }
tiny-skia = { version = "0.12", optional = true, default-features = false, features = ["std", "simd", "png-format"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
md-5 = "0.11.0"
sha1 = "0.11.0"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_NetworkManagement_WNet", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Security"] }
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux and the BSDs: where the window opens on X11 (already used by winit)
[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "android")))'.dependencies]
x11-dl = { version = "2.21", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[lints.clippy]
# style opinions, not bugs, that the code has never followed
type_complexity = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSButton", "NSControl", "NSResponder", "NSApplication", "NSImage", "NSEvent", "NSScreen"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSData"] }
raw-window-handle = "0.6"
